# One-time publication requested for 0.1.3; never runs for pull requests.
name: Release 0.1.3 BRAT beta
on:
  push:
    branches: [release/0.1.3-brat]
permissions:
  contents: read
concurrency:
  group: release-0.1.3-brat
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'pafloxy/obsidian-md2tex-workshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Check release identity
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          assert.equal(manifest.version, '0.1.3');
          assert.equal(require('./package.json').version, manifest.version);
          assert.equal(manifest.id, 'md2tex-workshop');
          assert.equal(manifest.isDesktopOnly, true);
          NODE
      - name: Fast checks
        run: npm run test:fast
      - name: Install test-only system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils python3
      - name: Export and verify public-file boundary
        run: |
          node scripts/public-release.cjs export --out-dir tmp/public-candidate
          node scripts/public-release.cjs verify --out-dir tmp/public-candidate
          cp -R tmp/public-candidate tmp/public-verification
      - name: Full regression, packaging, integrity and isolated host suite
        working-directory: tmp/public-verification
        run: npm test
      - name: Toolchain doctor and real quickstart PDF
        working-directory: tmp/public-verification
        run: |
          node scripts/workshop.cjs doctor
          node scripts/workshop.cjs build examples/quickstart/note.md --out-dir tmp/release-quickstart
      - name: Build only reviewed BRAT assets
        working-directory: tmp/public-candidate
        run: node scripts/package-plugin.cjs --format brat --out-dir ../brat-candidate
      - name: Require exact locally reviewed bytes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const expected = {
            'main.js': '57b06e325812b9ce83b4c5dafd5820654e39d57fae038a060026dacac6124b91',
            'manifest.json': 'c12cdded31ea2de89fe355efd97f578c5cc6fc0a7e3c8d88830c081cae0a0079',
            'styles.css': '9c1d22018862abaf8c545a0ac2b0547dd840fa356727532b96263a3c5e7f51ef'
          };
          assert.deepEqual(fs.readdirSync('tmp/brat-candidate').sort(), Object.keys(expected).sort());
          for (const [name, sha] of Object.entries(expected)) {
            assert.equal(createHash('sha256').update(fs.readFileSync(`tmp/brat-candidate/${name}`)).digest('hex'), sha, name);
          }
          assert.equal(JSON.parse(fs.readFileSync('tmp/brat-candidate/manifest.json')).version, '0.1.3');
          NODE
      - name: Create draft prerelease without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api 'repos/pafloxy/obsidian-md2tex-workshop/releases?per_page=100' > tmp/existing-releases.json
          gh api 'repos/pafloxy/obsidian-md2tex-workshop/git/matching-refs/tags/0.1.3' > tmp/existing-tags.json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          assert.ok(!require('./tmp/existing-releases.json').some(r => r.tag_name === '0.1.3'), 'Release already exists; do not replace it');
          assert.ok(!require('./tmp/existing-tags.json').some(r => r.ref === 'refs/tags/0.1.3'), 'Tag already exists; review before publication');
          NODE
          gh release create 0.1.3 tmp/brat-candidate/main.js tmp/brat-candidate/manifest.json tmp/brat-candidate/styles.css --target "$GITHUB_SHA" --title 0.1.3 --notes-file docs/releases/0.1.3-brat.md --draft --prerelease --latest=false
      - name: Download draft assets and verify exact readback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download 0.1.3 --dir tmp/hosted-readback --pattern main.js --pattern manifest.json --pattern styles.css
          cmp tmp/brat-candidate/main.js tmp/hosted-readback/main.js
          cmp tmp/brat-candidate/manifest.json tmp/hosted-readback/manifest.json
          cmp tmp/brat-candidate/styles.css tmp/hosted-readback/styles.css
      - name: Publish verified beta and inspect public metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit 0.1.3 --draft=false --prerelease --latest=false
          gh api repos/pafloxy/obsidian-md2tex-workshop/releases/tags/0.1.3 > tmp/published-release.json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const release = require('./tmp/published-release.json');
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, true);
          assert.equal(release.tag_name, '0.1.3');
          assert.equal(release.name, '0.1.3');
          assert.deepEqual(release.assets.map(a => a.name).sort(), ['main.js', 'manifest.json', 'styles.css']);
          console.log(release.html_url);
          NODE
